{% if question_list %}
    <ul>
    {% for question in question_list %}
        <li>
            <p>ID: {{question.id}} </p>
            <a href="{% url 'polls:frequency' question.id %}">{{ question.question_text }}</a>
            <p>{{question.pub_date}}</p>
        </li>
    {% endfor %}
    </ul>
{% else %}
    <p>No polls are available.</p>
{% endif %}
